<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="#aab2c0" width="24" height="24">
                    <path d="M3 4h18v2l-7 8v6h-4v-6L3 6V4z"/>
                </svg>
                <h1>LeadPredictor</h1>
            </div>
        </header>
        
        <main class="dashboard">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="form-group">
                    <label>Language</label>
                    <select class="custom-select">
                        <option>🇺🇸 English</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Currency</label>
                    <select class="custom-select">
                        <option>$ US Dollar</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Campaign Start</label>
                    <input type="date" id="start-date" value="2026-05-08">
                </div>
                
                <div class="form-group">
                    <label>Campaign End</label>
                    <input type="date" id="end-date" value="2026-11-04">
                </div>
                
                <div class="form-group">
                    <label>Total Revenue</label>
                    <div class="input-with-symbol">
                        <span class="symbol">$</span>
                        <input type="number" id="revenue" value="10000">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Avg. Order Value</label>
                    <div class="input-with-symbol">
                        <span class="symbol">$</span>
                        <input type="number" id="aov" value="1000">
                    </div>
                </div>
            </aside>
            
            <!-- Main Content -->
            <section class="main-content">
                <div class="top-row">
                    <!-- Chart Section -->
                    <div class="chart-card panel">
                        <div class="chart-wrapper">
                            <div class="y-axis">
                                <div class="y-label-vertical">Months</div>
                                <div class="y-ticks">
                                    <span>1-</span>
                                    <span>2-</span>
                                    <span>3-</span>
                                    <span>4-</span>
                                    <span>5-</span>
                                    <span>6-</span>
                                </div>
                            </div>
                            
                            <div class="chart-area" id="chart-area">
                                <!-- Bars rendered via JS -->
                            </div>
                        </div>
                        
                        <div class="x-axis">
                            <div class="x-ticks">
                                <span>0</span>
                                <span>20</span>
                                <span>40</span>
                                <span>60</span>
                                <span>80</span>
                                <span>100</span>
                                <span>120</span>
                            </div>
                            <div class="x-label-horizontal">people</div>
                        </div>
                    </div>
                    
                    <!-- Stats Section -->
                    <div class="stats-panel">
                        <div class="stat-card panel">
                            <div class="stat-header">
                                <div class="stat-title"><span class="icon">📁</span> Prospects</div>
                                <div class="stat-percent">100%</div>
                            </div>
                            <div class="stat-value" id="val-prospects">125</div>
                            <div class="progress-bar"><div class="fill" id="fill-prospects" style="width:100%"></div></div>
                        </div>
                        
                        <div class="stat-card panel">
                            <div class="stat-header">
                                <div class="stat-title"><span class="icon">👤</span> Leads</div>
                                <div class="stat-percent" id="pct-leads">20%</div>
                            </div>
                            <div class="stat-value" id="val-leads">25</div>
                            <div class="progress-bar"><div class="fill" id="fill-leads" style="width:20%"></div></div>
                        </div>
                        
                        <div class="stat-card panel">
                            <div class="stat-header">
                                <div class="stat-title"><span class="icon">🏆</span> Customers</div>
                                <div class="stat-percent" id="pct-customers">8%</div>
                            </div>
                            <div class="stat-value" id="val-customers">10</div>
                            <div class="progress-bar"><div class="fill" id="fill-customers" style="width:8%"></div></div>
                        </div>
                    </div>
                </div>
                
                <!-- Bottom Sliders Section -->
                <div class="sliders-container panel">
                    <div class="slider-group">
                        <label>Lead Response Rate</label>
                        <div class="slider-wrapper">
                            <input type="range" id="lead-rate" min="1" max="100" value="40" step="1">
                        </div>
                        <div class="slider-val" id="lead-rate-val">40.00%</div>
                    </div>
                    
                    <div class="slider-group">
                        <label>Prospect Response Rate</label>
                        <div class="slider-wrapper">
                            <input type="range" id="prospect-rate" min="1" max="100" value="20" step="1">
                        </div>
                        <div class="slider-val" id="prospect-rate-val">20.00%</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip"></div>

    <script src="script.js"></script>
</body>
</html>

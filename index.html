<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <defs>
                            <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#60a5fa" />
                                <stop offset="100%" stop-color="#3b82f6" />
                            </linearGradient>
                        </defs>
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                </div>
                <h1><span class="text-bold">Lead</span><span class="text-light">Predictor</span></h1>
            </div>
        </header>
        
        <main class="dashboard">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="form-group">
                    <label data-i18n="language">Language</label>
                    <select class="custom-select" id="language-select">
                        <option value="en">🇺🇸 English</option>
                        <option value="bg">🇧🇬 Bulgarian</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label data-i18n="currency">Currency</label>
                    <select class="custom-select" id="currency-select">
                        <option value="usd">$ US Dollar</option>
                        <option value="eur">€ EURO</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label data-i18n="campaign_start">Campaign Start</label>
                    <input type="date" id="start-date" value="2026-05-08">
                </div>
                
                <div class="form-group">
                    <label data-i18n="campaign_end">Campaign End</label>
                    <input type="date" id="end-date" value="2026-11-04">
                </div>
                
                <div class="form-group">
                    <label data-i18n="total_revenue">Total Revenue</label>
                    <div class="input-with-symbol">
                        <span class="symbol currency-symbol">$</span>
                        <input type="number" id="revenue" value="10000">
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-i18n="avg_order_value">Avg. Order Value</label>
                    <div class="input-with-symbol">
                        <span class="symbol currency-symbol">$</span>
                        <input type="number" id="aov" value="1000">
                    </div>
                </div>
            </aside>
            
            <!-- Main Content -->
            <section class="main-content">
                <div class="top-row">
                    <!-- Chart Section -->
                    <div class="chart-card panel">
                        <div class="chart-wrapper">
                            <div class="y-axis">
                                <div class="y-label-vertical" data-i18n="months">Months</div>
                                <div class="y-ticks">
                                    <span>1-</span>
                                    <span>2-</span>
                                    <span>3-</span>
                                    <span>4-</span>
                                    <span>5-</span>
                                    <span>6-</span>
                                </div>
                            </div>
                            
                            <div class="chart-area" id="chart-area">
                                <!-- Bars rendered via JS -->
                            </div>
                        </div>
                        
                        <div class="x-axis">
                            <div class="x-ticks">
                                <span>0</span>
                                <span>20</span>
                                <span>40</span>
                                <span>60</span>
                                <span>80</span>
                                <span>100</span>
                                <span>120</span>
                            </div>
                            <div class="x-label-horizontal" data-i18n="people">people</div>
                        </div>
                    </div>
                    
                    <!-- Stats Section -->
                    <div class="stats-panel">
                        <div class="stat-card panel">
                            <div class="stat-header">
                                <div class="stat-title"><span class="icon">📁</span> <span data-i18n="prospects">Prospects</span></div>
                                <div class="stat-percent" id="pct-prospects">100%</div>
                            </div>
                            <div class="stat-value" id="val-prospects">125</div>
                            <div class="progress-bar"><div class="fill" id="fill-prospects" style="width:100%"></div></div>
                        </div>
                        
                        <div class="stat-card panel">
                            <div class="stat-header">
                                <div class="stat-title"><span class="icon">👤</span> <span data-i18n="leads">Leads</span></div>
                                <div class="stat-percent" id="pct-leads">20%</div>
                            </div>
                            <div class="stat-value" id="val-leads">25</div>
                            <div class="progress-bar"><div class="fill" id="fill-leads" style="width:20%"></div></div>
                        </div>
                        
                        <div class="stat-card panel">
                            <div class="stat-header">
                                <div class="stat-title"><span class="icon">🏆</span> <span data-i18n="customers">Customers</span></div>
                                <div class="stat-percent" id="pct-customers">8%</div>
                            </div>
                            <div class="stat-value" id="val-customers">10</div>
                            <div class="progress-bar"><div class="fill" id="fill-customers" style="width:8%"></div></div>
                        </div>
                    </div>
                </div>
                
                <!-- Bottom Sliders Section -->
                <div class="sliders-container panel">
                    <div class="slider-group">
                        <label data-i18n="lead_response_rate">Lead Response Rate</label>
                        <div class="slider-wrapper">
                            <input type="range" id="lead-rate" min="1" max="100" value="40" step="1">
                        </div>
                        <div class="slider-val" id="lead-rate-val">40.00%</div>
                    </div>
                    
                    <div class="slider-group">
                        <label data-i18n="prospect_response_rate">Prospect Response Rate</label>
                        <div class="slider-wrapper">
                            <input type="range" id="prospect-rate" min="1" max="100" value="20" step="1">
                        </div>
                        <div class="slider-val" id="prospect-rate-val">20.00%</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip"></div>

    <script src="script.js"></script>
</body>
</html>
